.ui{position:fixed;left:0;right:0;max-width:440px;margin:0 auto;padding:10px 14px;box-sizing:border-box;text-align:center;pointer-events:none}
.ui button{pointer-events:auto}

#bot{bottom:env(safe-area-inset-bottom,0px)}

button:active{transform:scale(.97)}
.link{background:none;color:var(--fg);font-size:13px;font-weight:400;opacity:.6;margin-top:2px;padding:6px}
</style>
</head>

  var te=Math.min(1,weight/300);
  var tgt=(phase==='feed'||phase==='eating')?0:Math.sin(ts/2500)*.35;
  camAng+=(tgt-camAng)*Math.min(1,dt*3);
  var dist=9.5+te*7;
  cam.position.set(Math.sin(camAng)*dist,3.2,Math.cos(camAng)*dist);
  cam.lookAt(0,1.9,0);
  if(phase==='check'){
    pos=(pos+(.45+idx*.07)*dt)%1;
    mk.setAttribute('transform','rotate('+(pos*360)+' 100 100)');
  }
  var mouthOpen=0;
  if(choc.visible){
    if(phase==='eating'){
      var p=Math.min(1,(ts-eatStart)/450);
      choc.position.lerpVectors(eatFrom,window._mouth,p);
      choc.scale.setScalar(chocScale(eatSize)*(1-p*.95));
      mouthOpen=.8;
      if(p>=1)choc.visible=false;
    }else if(phase==='feed'){
      if(!drag){choc.position.lerp(homeFeed,Math.min(1,dt*8));choc.position.y+=Math.sin(ts/350)*.004}
      choc.rotation.set(Math.PI/2+.2,0,Math.sin(ts/300)*.12);
      choc.scale.setScalar(chocScale(hits));
      if(choc.position.distanceTo(window._mouth)<1.2)mouthOpen=1;
    }else{
      choc.position.set(homeCheck.x,homeCheck.y+Math.sin(ts/400)*.15,homeCheck.z);
      choc.scale.setScalar(chocScale(hits));
      choc.rotation.set(.4,choc.rotation.y+dt*1.5,0);
    }
  }
  if(phase==='eating'&&!choc.visible)mouthOpen=Math.abs(Math.sin((ts-eatStart)/90))*.6;
  open+=(mouthOpen-open)*Math.min(1,dt*18);
  var hr=window._hr;
  mouth.scale.set(hr*.17*(1-open*.15),hr*(.03+open*.17),hr*.06);faceUpd(open);
  if(squash>0){squash=Math.max(0,squash-dt*2.5);var s=Math.sin(squash*Math.PI);kid.scale.set(1+s*.06,1-s*.05,1+s*.06)}else kid.scale.set(1,1,1);
  if(phase==='toilet')toiletTick(ts);scrapTick(dt);
  renderer.render(scene,cam);
}
requestAnimationFrame(frame);

/* sürükleyerek yedirme */
var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hp=new THREE.Vector3();
function setNdc(e){var r=cvs.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam)}
cvs.addEventListener('pointerdown',function(e){
  if(phase!=='feed')return;
  var r=cvs.getBoundingClientRect(),v=choc.position.clone().project(cam);
  var sx=(v.x+1)/2*r.width,sy=(1-v.y)/2*r.height;
  if(Math.hypot(e.clientX-r.left-sx,e.clientY-r.top-sy)<110){drag=true;cvs.setPointerCapture(e.pointerId)}
});
cvs.addEventListener('pointermove',function(e){
  if(!drag)return;setNdc(e);
  var pl=new THREE.Plane(new THREE.Vector3(0,0,1),-(window._mouth.z+.9));
  if(ray.ray.intersectPlane(pl,hp))choc.position.copy(hp);
});
function endDrag(){
  if(!drag)return;drag=false;
  if(choc.position.distanceTo(window._mouth)<1.2)eat();
}
cvs.addEventListener('pointerup',endDrag);cvs.addEventListener('pointercancel',endDrag);

function eat(){
  phase='eating';eatStart=performance.now();eatFrom.copy(choc.position);for(var q=0;q<4;q++)setTimeout(SFX.chomp,500+q*320);
  info.textContent='Nam nam nam... 😋';
  setTimeout(function(){
    weight=Math.min(300,Math.round((weight+pendGain)*10)/10);eaten++;
    $('kg').textContent=weight+'/300 kg';$('cnt').textContent=eaten;$('last').textContent=names[eatSize];
    drawKid();squash=1;SFX.gulp();
    results=[];drawDots();go.style.display='block';
    if(weight>=300){phase='full';torn=true;drawKid();tearBurst();SFX.tear();setTimeout(SFX.pop,350);info.textContent='300 kg sınırına ulaştı! 😵 Acil tuvalete!';go.textContent='🚽 Tuvalete götür'}
    else{info.textContent='Yedi! +'+pendGain+' kg 🍽️';go.textContent='🍫 Çikolata Yedir';phase='idle';if(weight>=200&&!creaked){creaked=true;SFX.creak();info.textContent+=' Tişört çatırdıyor...'}}
  },1900);
}

function drawDots(){var s='';for(var i=0;i<7;i++)s+='<i class="'+(i<results.length?(results[i]?'h':'m'):'')+'"></i>';dots.innerHTML=s}
function newCheck(){
  zw=Math.max(.08,.17-idx*.013);zc=.2+Math.random()*.6;
  zone.setAttribute('stroke-dasharray',(zw*502.65)+' 503');
  zone.setAttribute('transform','rotate('+(((zc-zw/2)*360)-90)+' 100 100)');
  pos=0;
  info.textContent='Skill check '+(idx+1)+'/7 — yeşil yayda bas!';go.textContent='⚡ TIKLA';
}
function start(){SFX.pick();phase='check';idx=0;hits=0;results=[];drawDots();bar.style.display='block';choc.visible=true;choc.position.copy(homeCheck);newCheck()}
function press(){
  var ok=Math.abs(((pos-zc+1.5)%1)-.5)<=zw/2;ok?SFX.hit():SFX.miss();results.push(ok);if(ok)hits++;drawDots();idx++;
  if(idx>=7){finish();return}
  info.textContent=ok?'✅ Tam isabet!':'❌ Iskaladın!';
  setTimeout(function(){if(phase==='check')newCheck()},350);
}
function finish(){
  phase='feed';SFX.fan();bar.style.display='none';eatSize=hits;pendGain=Math.round((.5+hits*4)*10)/10;
  go.style.display='none';
  info.textContent=hits+'/7 → '+names[hits]+' çikolata! 👆 Sürükle, çocuğun ağzına götür!';
}
go.addEventListener('click',function(){ac();if(phase==='idle')start();else if(phase==='check')press();else if(phase==='full')startToilet()});
$('reset').addEventListener('click',function(){
  phase='idle';weight=0;eaten=0;results=[];choc.visible=false;drag=false;toilet.visible=false;resetClothes();kid.position.set(0,0,0);kid.rotation.set(0,0,0);
  $('kg').textContent='0/300 kg';$('cnt').textContent='0';$('last').textContent='-';
  bar.style.display='none';go.style.display='block';go.textContent='🍫 Çikolata Yedir';
  info.textContent='Hazır olunca çikolata yedir!';drawKid();drawDots();
});
drawKid();drawDots();
</script>
